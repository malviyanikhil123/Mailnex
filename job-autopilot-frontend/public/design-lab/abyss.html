<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyss · Job Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Azeret+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--abyss:#021821;--deep:#03222e;--glow:#3CF2C8;--glow-d:rgba(60,242,200,.22);--coral:#FF7A59;--sand:#E9D8B4;--ink:#D9F7F2;--dim:#8FB9B3;
    --s:"Sora",sans-serif;--m:"Azeret Mono",monospace;--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--abyss);color:var(--ink);font:15px/1.55 var(--s);overflow-x:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  ::selection{background:var(--glow);color:var(--abyss)}
  :focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:14px}
  #world{position:fixed;inset:0;z-index:0}
  #app{position:relative;z-index:1;min-height:100vh;padding-right:120px}

  /* ---------- depth gauge navigation ---------- */
  .gauge{position:fixed;top:0;right:0;bottom:0;z-index:5;width:120px;display:flex;flex-direction:column;align-items:center;padding:26px 0 90px}
  .gauge .logo{font:700 13px/1.2 var(--s);text-align:center;letter-spacing:.14em;text-transform:uppercase;color:var(--glow);margin-bottom:18px}
  .track{position:relative;flex:1;width:2px;margin-right:34px;background:linear-gradient(var(--glow),rgba(60,242,200,.1))}
  .mark{position:absolute;right:-6px;display:flex;align-items:center;gap:10px;flex-direction:row-reverse;border:0;background:none;padding:0;transform:translateY(-50%);color:var(--dim)}
  .mark i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;background:var(--abyss);transition:all .3s}
  .mark span{position:absolute;right:24px;white-space:nowrap;text-align:right;font-size:13px;line-height:1.2}
  .mark span small{display:block;font:11px var(--m);color:#5f8a84}
  .mark:hover{color:var(--ink)}
  .mark[aria-current]{color:var(--glow)}
  .mark[aria-current] i{background:var(--glow);box-shadow:0 0 16px var(--glow)}
  .needle{position:absolute;left:10px;transform:translateY(-50%);font:600 12px var(--m);color:var(--glow);white-space:nowrap;transition:top .9s var(--ease)}
  .needle::before{content:"◀ ";}

  .page{max-width:1080px;margin:0 auto;padding:44px 40px 120px}
  .head{margin-bottom:28px}
  .zone{font:12px var(--m);color:var(--glow);letter-spacing:.2em;text-transform:uppercase}
  .head h1{margin:6px 0 6px;font:300 52px/1.05 var(--s);letter-spacing:-.02em}
  .head h1 b{font-weight:700}
  .head p{margin:0;color:var(--dim);max-width:56ch}

  /* ---------- overview: bubbles, schools, sonar trace ---------- */
  .pods{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:34px}
  .pod{position:relative;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;text-align:center;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 35%),radial-gradient(circle,rgba(60,242,200,.1),rgba(3,34,46,.5) 70%);
    border:1px solid var(--glow-d);animation:bob 6s ease-in-out infinite;animation-delay:var(--d)}
  .pod:first-child{width:220px;height:220px}
  .pod svg{position:absolute;inset:-1px;transform:rotate(-90deg)}
  .pod svg circle{fill:none;stroke:var(--glow);stroke-width:2;stroke-linecap:round}
  .pod b{display:block;font:600 34px/1 var(--m)}
  .pod:first-child b{font-size:52px;color:var(--glow)}
  .pod span{font-size:12.5px;color:var(--dim)}
  @keyframes bob{50%{transform:translateY(-10px)}}
  .twocol{display:grid;grid-template-columns:1.1fr .9fr;gap:30px}
  .glass{border-radius:24px;padding:22px 24px;background:rgba(3,38,50,.55);border:1px solid var(--glow-d);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .glass h2{margin:0 0 14px;font:600 17px var(--s)}
  .school{display:grid;grid-template-columns:130px 1fr 30px;align-items:center;gap:10px;padding:5px 8px;margin:0 -8px;border-radius:12px;cursor:default}
  .school:hover,.school.on{background:rgba(60,242,200,.08)}
  .school .fish{display:flex;gap:3px;flex-wrap:wrap}
  .school .fish svg{fill:var(--glow);opacity:.85;animation:swim 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
  .school.on .fish svg{fill:#fff}
  @keyframes swim{50%{transform:translateX(3px)}}
  .school b{font:600 14px var(--m);text-align:right}
  .sonar{width:100%;height:170px}
  .sonar path.line{fill:none;stroke:var(--glow);stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(60,242,200,.7))}
  .sonar path.area{fill:url(#ga)}
  .sonar text{font:11px var(--m);fill:#5f8a84}
  .sonar circle{fill:var(--glow)}

  /* ---------- jobs: specimen capsules ---------- */
  .ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
  .seg{display:flex;padding:4px;border-radius:99px;background:rgba(3,38,50,.7);border:1px solid var(--glow-d)}
  .seg button{border:0;background:none;padding:8px 16px;border-radius:99px;color:var(--dim);font-size:14px;transition:all .25s}
  .seg button[aria-pressed="true"]{background:var(--glow);color:var(--abyss);font-weight:600}
  .srch{flex:1;min-width:220px;height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--glow-d);background:rgba(3,38,50,.7);outline:none}
  .srch:focus{border-color:var(--glow)}
  .srch::placeholder{color:#5f8a84}
  .caps{display:grid;gap:12px}
  .cap{border-radius:40px;border:1px solid var(--glow-d);background:rgba(3,38,50,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-radius .5s var(--ease),background .3s}
  .cap:hover{background:rgba(3,50,64,.75)}
  .cap.open{border-radius:26px;border-color:var(--glow)}
  .cap>button{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:18px;align-items:center;width:100%;padding:12px 24px 12px 12px;border:0;background:none;text-align:left}
  .ring{position:relative;width:62px;height:62px}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 15px var(--m)}
  .cap h3{margin:0;font:600 17px/1.25 var(--s)}
  .cap .co{font-size:13.5px;color:var(--dim)}
  .cap .when{font:12.5px var(--m);color:var(--dim);white-space:nowrap}
  .cap .chev{transition:transform .4s var(--ease)}
  .cap.open .chev{transform:rotate(180deg)}
  .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
  .cap.open .more{grid-template-rows:1fr}
  .more>div{overflow:hidden}
  .more .in{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:18px;align-items:end;padding:4px 26px 22px 92px}
  .more dt{font:11px var(--m);color:var(--glow);letter-spacing:.14em;text-transform:uppercase}
  .more dd{margin:4px 0 0;font-size:14px}
  .pill{height:44px;padding:0 22px;border-radius:99px;border:0;background:var(--glow);color:var(--abyss);font:600 15px var(--s);transition:box-shadow .25s,transform .15s}
  .pill:hover{box-shadow:0 0 24px rgba(60,242,200,.55)}
  .pill:active{transform:scale(.97)}
  .pill.o{background:transparent;color:var(--glow);border:1px solid var(--glow)}
  .pill.coral{background:var(--coral);color:#2a0b02}
  .pill:disabled{opacity:.5;cursor:default;box-shadow:none}
  .rem{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:rgba(60,242,200,.15);color:var(--glow);font-size:11.5px;vertical-align:2px}

  /* ---------- sources: sonar radar ---------- */
  .radarwrap{display:grid;grid-template-columns:minmax(0,480px) 1fr;gap:34px;align-items:center}
  .radar{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(60,242,200,.1),rgba(2,24,33,.9) 70%);border:1px solid var(--glow-d);overflow:hidden}
  .radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 calc(20% - 1px),rgba(60,242,200,.25) calc(20% - 1px) 20%)}
  .radar::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid rgba(60,242,200,.2)}
  .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(60,242,200,.45),transparent 22%);animation:turn 4s linear infinite}
  @keyframes turn{to{transform:rotate(360deg)}}
  .blip{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow);transition:transform .25s}
  .blip.failed{background:var(--coral);box-shadow:0 0 14px var(--coral);animation:ping 1s ease-in-out infinite}
  .blip.waiting{background:transparent;border:2px dashed var(--dim);box-shadow:none}
  .blip.on{transform:scale(1.9)}
  @keyframes ping{50%{opacity:.25}}
  .contacts{display:grid;gap:6px}
  .contact{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;border:1px solid transparent;background:none;text-align:left}
  .contact:hover,.contact.on{border-color:var(--glow-d);background:rgba(3,38,50,.6)}
  .contact i{width:10px;height:10px;border-radius:50%;background:var(--glow)}
  .contact i.failed{background:var(--coral)}
  .contact i.waiting{background:transparent;border:2px dashed var(--dim)}
  .contact small{display:block;color:var(--dim);font-size:12.5px}
  .contact em{font:12.5px var(--m);font-style:normal;color:var(--dim);text-align:right}

  /* ---------- profile: sub ID plate ---------- */
  .plate{position:relative;border-radius:22px;padding:34px 38px;background:linear-gradient(145deg,#2c3d42,#1a2a2f 60%,#243539);border:1px solid #4a6066;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 60px rgba(0,0,0,.4)}
  .plate .rv{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9fb2b5,#44585c)}
  .plate h2{margin:0;font:700 34px/1 var(--s);letter-spacing:.02em}
  .plate .hull{font:13px var(--m);color:var(--glow);letter-spacing:.2em;margin-top:6px}
  .dials{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0}
  .dial{text-align:center}
  .dial svg{width:120px;height:80px}
  .dial b{display:block;font:600 18px var(--m);margin-top:-6px}
  .dial span{font-size:12.5px;color:var(--dim)}
  .cargo{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 24px}
  .cargo span{padding:8px 14px;border-radius:10px;background:rgba(60,242,200,.1);border:1px solid var(--glow-d);font-size:14px}
  .press{display:grid;gap:10px}
  .press div{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:rgba(255,122,89,.1);border:1px solid rgba(255,122,89,.35);font-size:14.5px}
  .plate h3{margin:0;font:600 12px var(--m);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

  /* ---------- gate: porthole ---------- */
  .gate{min-height:100vh;display:grid;place-items:center;padding:30px 16px}
  .porthole{position:relative;width:min(560px,92vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle,rgba(3,38,50,.82) 60%,rgba(3,38,50,.6));border:18px solid #4a6066;box-shadow:inset 0 0 0 4px #2c3d42,0 0 0 4px #2c3d42,0 40px 80px rgba(0,0,0,.5)}
  .porthole .bolt{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#b9c7c9,#44585c)}
  .porthole form{width:72%;text-align:center}
  .porthole h1{margin:0;font:300 34px/1.1 var(--s)}
  .porthole h1 b{font-weight:700;color:var(--glow)}
  .porthole p{margin:8px 0 18px;color:var(--dim);font-size:14px}
  .fl{margin-bottom:10px;text-align:left}
  .fl label{display:block;margin:0 0 5px 16px;font-size:12.5px;color:var(--dim)}
  .fl input{width:100%;height:46px;padding:0 18px;border-radius:99px;border:1px solid var(--glow-d);background:rgba(2,24,33,.9);outline:none}
  .fl input:focus{border-color:var(--glow)}
  .fl input[aria-invalid="true"]{border-color:var(--coral)}
  .fl .err{margin:5px 0 0 16px;color:var(--coral);font-size:13px}
  .porthole .pill{width:100%;margin-top:8px}
  .lnk{border:0;background:none;color:var(--glow);text-decoration:underline;text-underline-offset:3px;padding:0}
  .o2{height:8px;border-radius:8px;background:rgba(60,242,200,.12);overflow:hidden;margin:0 0 16px}
  .o2 b{display:block;height:100%;background:var(--glow);border-radius:8px;transition:width .5s var(--ease)}
  .check{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;border:1px solid var(--glow-d);background:none;width:100%;text-align:left;margin-bottom:6px;font-size:14px}
  .check i{width:20px;height:20px;border-radius:50%;border:2px solid var(--glow);flex:none;display:grid;place-items:center}
  .check[aria-pressed="true"] i{background:var(--glow)}
  .check[aria-pressed="true"] i::after{content:"";width:8px;height:4px;border:2px solid var(--abyss);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
  .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(2,24,33,.3);border-top-color:var(--abyss);display:inline-block;vertical-align:-3px;margin-right:8px;animation:turn .8s linear infinite}

  /* ---------- loading ---------- */
  .descend{min-height:100vh;display:grid;place-items:center;text-align:center}
  .depth{font:600 96px/1 var(--m);color:var(--glow);text-shadow:0 0 30px rgba(60,242,200,.5)}
  .depth small{font-size:30px}
  .descend p{margin:12px 0 0;color:var(--dim)}
  .pings{position:relative;width:160px;height:160px;margin:0 auto 20px}
  .pings i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--glow);animation:pingr 2.4s ease-out infinite;opacity:0}
  .pings i:nth-child(2){animation-delay:.8s}.pings i:nth-child(3){animation-delay:1.6s}
  @keyframes pingr{from{transform:scale(.2);opacity:1}to{transform:scale(1);opacity:0}}

  /* ---------- states ---------- */
  .sk{display:block;border-radius:99px;background:linear-gradient(90deg,rgba(60,242,200,.05) 20%,rgba(60,242,200,.18) 50%,rgba(60,242,200,.05) 80%);background-size:250% 100%;animation:wave 1.6s ease-in-out infinite}
  @keyframes wave{from{background-position:120% 0}to{background-position:-120% 0}}
  .none{display:grid;justify-items:center;text-align:center;padding:50px 20px;gap:8px}
  .none h3{margin:12px 0 0;font:600 24px var(--s)}
  .none p{margin:0;color:var(--dim);max-width:40ch}
  .lostsig{display:flex;align-items:center;gap:16px;padding:16px 20px;margin-bottom:24px;border-radius:24px;background:rgba(255,122,89,.12);border:1px solid rgba(255,122,89,.45)}
  .lostsig b{display:block;color:var(--coral)}
  .lostsig .pill{margin-left:auto}
  #toasts{position:fixed;left:24px;bottom:80px;z-index:50;display:grid;gap:10px}
  .toast{max-width:340px;padding:14px 18px;border-radius:24px;background:rgba(3,50,64,.92);border:1px solid var(--glow);color:var(--ink);font-size:14.5px;transform:translateY(60px) scale(.8);opacity:0;transition:all .6s var(--ease);box-shadow:0 0 30px rgba(60,242,200,.25)}
  .toast.in{transform:none;opacity:1}
  .toast.warn{border-color:var(--coral);box-shadow:0 0 30px rgba(255,122,89,.25)}
  .kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .kit h4{margin:0 0 12px;font:600 12px var(--m);letter-spacing:.18em;text-transform:uppercase;color:var(--glow)}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .tg{width:54px;height:30px;border-radius:99px;border:1px solid var(--glow);background:none;position:relative}
  .tg::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:all .3s var(--ease)}
  .tg[aria-checked="true"]::after{transform:translateX(24px);background:var(--glow);box-shadow:0 0 12px var(--glow)}
  .sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(2,24,33,.7)}
  .sheet .glass{width:min(420px,92vw)}

  @media (max-width:980px){
    #app{padding-right:0;padding-bottom:70px}
    .gauge{top:auto;left:0;height:64px;width:auto;flex-direction:row;padding:0 12px;background:rgba(2,24,33,.92);border-top:1px solid var(--glow-d)}
    .gauge .logo,.needle{display:none}
    .track{height:2px;width:auto;flex:1;background:var(--glow-d)}
    .mark{position:relative;top:auto!important;right:auto;transform:none;flex:1;flex-direction:column;gap:4px}
    .track{display:flex;align-items:center;justify-content:space-around}
    .mark span{position:static;text-align:center;font-size:11px}
    .mark span small{display:none}
    .page{padding:28px 16px 120px}
    .head h1{font-size:38px}
    .twocol,.radarwrap{grid-template-columns:1fr}
    .pod{width:130px;height:130px}.pod:first-child{width:170px;height:170px}
    .more .in{grid-template-columns:1fr 1fr;padding:4px 20px 20px}
    .cap>button{grid-template-columns:52px minmax(0,1fr) auto}
    .cap .when{display:none}
    .dials{grid-template-columns:1fr}
    .porthole{border-width:10px}
    .porthole form{width:80%}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="world" aria-hidden="true"></div>
<div id="app"></div>
<nav class="gauge" id="gauge" aria-label="Depth"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lab-core.js"></script>
<script>
const { $, $$, esc, fmt, cname, ago, DATA, rand, sprite, glowTex, stage, toast, go, reduce } = Lab;
const T = THREE;

/* ================= 3D: the water column ================= */
let focus = null;
const DEPTH = { login: 0, signup: 0, loading: 0.5, overview: 1, jobs: 2, sources: 3, profile: 4, kit: 4 };
const W = (() => {
  const st = stage($('#world'), { cam: new T.Vector3(0, 1.2, 10), look: new T.Vector3(0, 0.8, 0), px: 1.5, py: 0.7, alpha: false });
  const { scene, camera } = st;
  const cols = [0x0a4a5c, 0x03303f, 0x021821, 0x01101a, 0x010a10].map((c) => new T.Color(c));
  scene.background = cols[0].clone();
  scene.fog = new T.FogExp2(cols[0].getHex(), 0.07);
  scene.add(new T.HemisphereLight(0x3cf2c8, 0x010a0e, 0.55));
  const topL = new T.DirectionalLight(0x9fffe8, 0.5); topL.position.set(0, 10, 2); scene.add(topL);
  const floorGeo = new T.PlaneGeometry(40, 30, 60, 45); floorGeo.rotateX(-Math.PI / 2);
  const fp = floorGeo.attributes.position; for (let i = 0; i < fp.count; i++) { const x = fp.getX(i), z = fp.getZ(i); fp.setY(i, Math.sin(x * 0.5) * 0.3 + Math.cos(z * 0.7 + x * 0.2) * 0.35 + (rand() - 0.5) * 0.15); }
  floorGeo.computeVertexNormals();
  const floor = new T.Mesh(floorGeo, new T.MeshStandardMaterial({ color: 0x3a4b44, flatShading: true })); floor.position.y = -2.4; scene.add(floor);
  const kelps = [];
  for (let i = 0; i < 22; i++) { const h = 3 + rand() * 4; const g = new T.PlaneGeometry(0.22, h, 1, 14); g.translate(0, h / 2, 0);
    const m = new T.Mesh(g, new T.MeshStandardMaterial({ color: i % 2 ? 0x1f6b4f : 0x2a8a5c, side: T.DoubleSide })); m.position.set((rand() - 0.5) * 18, -2.4, -2 - rand() * 8); m.rotation.y = rand() * 3; scene.add(m);
    kelps.push({ m, base: Float32Array.from(g.attributes.position.array), ph: rand() * 6 }); }
  for (let i = 0; i < 16; i++) { const c = new T.Mesh(new T.IcosahedronGeometry(0.25 + rand() * 0.45, 0), new T.MeshStandardMaterial({ color: i % 3 ? 0xFF7A59 : 0xFFB07A, flatShading: true, emissive: 0x3a1208 }));
    c.position.set((rand() - 0.5) * 16, -2.2, -1 - rand() * 7); c.scale.y = 0.6 + rand(); scene.add(c); }
  const rows = DATA.byCountry.filter((r) => r.country !== 'unknown'); const mx = Math.max(...rows.map((r) => r.n));
  const jellies = rows.map((r, i) => { const size = 0.35 + 0.7 * r.n / mx; const g = new T.Group();
    const bell = new T.Mesh(new T.SphereGeometry(size, 28, 16, 0, 6.283, 0, Math.PI / 2), new T.MeshStandardMaterial({ color: 0x3CF2C8, emissive: 0x19a88a, emissiveIntensity: 0.9, transparent: true, opacity: 0.55, side: T.DoubleSide }));
    g.add(bell, sprite(0x3CF2C8, size * 2.2));

  const ck = e.target.closest('.check'); if (ck) { const on = ck.getAttribute('aria-pressed') !== 'true'; ck.setAttribute('aria-pressed', String(on)); checks += on ? 1 : -1; $('#o2') && ($('#o2').style.width = Math.min(100, checks * 20 + 20) + '%'); return; }
  const tg = e.target.closest('.tg'); if (tg) return tg.setAttribute('aria-checked', String(tg.getAttribute('aria-checked') !== 'true'));
  if (e.target.closest('[data-sheet]')) { const m = document.createElement('div'); m.className = 'sheet';
    m.innerHTML = '<div class="glass" role="dialog" aria-label="Salary floor"><h2>Set a salary floor</h2><p style="color:var(--dim);margin:0 0 14px">Roles paying less stay in the deep.</p><div class="fl"><label for="sf">Minimum (₹ LPA)</label><input id="sf" type="number" placeholder="8"></div><div class="row" style="margin-top:12px"><button class="pill" data-x>Save</button><button class="pill o" data-x>Cancel</button></div></div>';
    document.body.appendChild(m); return; }
  if (e.target.closest('[data-x]')) { toast('Saved'); return $('.sheet')?.remove(); }
  if (e.target.classList.contains('sheet')) e.target.remove();
});
document.addEventListener('pointerover', (e) => {
  const s = e.target.closest('.school'); focus = s ? s.dataset.code : null; $$('.school').forEach((x) => x.classList.toggle('on', x === s));
  const c = e.target.closest('[data-src]'); if (Lab.current.screen === 'sources') { hot = c ? +c.dataset.src : null; $$('.blip').forEach((b) => b.classList.toggle('on', +b.dataset.src === hot)); $$('.contact').forEach((b) => b.classList.toggle('on', +b.dataset.src === hot)); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value; clearTimeout(window._q); window._q = setTimeout(() => { go('jobs'); const i = $('#q'); i.focus(); i.setSelectionRange(q.length, q.length); }, 300); } });
document.addEventListener('submit', (e) => { e.preventDefault();
  if (e.target.id === 'login') { go('login', 'skeleton'); setTimeout(() => go('loading'), 900); }
  if (e.target.id === 'signup') { toast('Gear checked. Diving!'); go('loading'); } });
addEventListener('keydown', (e) => { if (e.key === 'Escape') $('.sheet')?.remove(); });
Lab.start({ show });
</script>
