<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Planet · Job Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600&family=Red+Hat+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--space:#0B0706;--panel:#170d0a;--panel-2:#211310;--line:#3a241b;--rust:#FF6A2B;--rust-d:#b8441a;--sand:#F2C99A;--ink:#F4E3D0;--dim:#B8977C;--haz:#FFB020;--ok:#7BD88F;--bad:#FF4D3D;
    --h:"Chakra Petch",sans-serif;--b:"Red Hat Text",sans-serif;--m:"Red Hat Mono",monospace}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--space);color:var(--ink);font:14.5px/1.5 var(--b);overflow-x:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  ::selection{background:var(--rust);color:#000}
  :focus-visible{outline:2px solid var(--haz);outline-offset:2px}
  .cap{font:600 11.5px/1 var(--h);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

  /* ---------- mission bar ---------- */
  .mbar{display:flex;align-items:stretch;height:58px;border-bottom:1px solid var(--line);background:#0f0806}
  .mbar .logo{display:flex;align-items:center;gap:10px;padding:0 20px;border-right:1px solid var(--line);font:700 16px var(--h);letter-spacing:.08em;text-transform:uppercase}
  .tabs{display:flex}
  .tabs button{display:flex;align-items:center;gap:10px;padding:0 20px;border:0;border-right:1px solid var(--line);background:none;color:var(--dim);font:600 14px var(--h);letter-spacing:.1em;text-transform:uppercase;position:relative}
  .tabs button kbd{display:grid;place-items:center;width:22px;height:22px;border:1px solid currentColor;font:600 12px var(--m)}
  .tabs button:hover{color:var(--ink);background:var(--panel)}
  .tabs button[aria-current]{color:var(--rust);background:var(--panel)}
  .tabs button[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--rust)}
  .clock{margin-left:auto;display:flex}
  .clock div{padding:0 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
  .clock b{font:600 17px/1.1 var(--m);color:var(--ink)}
  .crewbtn{border:0;border-left:1px solid var(--line);background:none;padding:0 18px;display:flex;align-items:center;gap:10px}
  .crewbtn i{width:32px;height:32px;display:grid;place-items:center;background:var(--rust);color:#000;font:700 14px var(--h);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  .ticker{height:32px;display:flex;align-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:#120a07;font:13px var(--m);white-space:nowrap}
  .ticker .lab{flex:none;height:100%;display:flex;align-items:center;padding:0 14px;background:var(--rust);color:#000;font:700 12px var(--h);letter-spacing:.12em}
  .ticker .run{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
  .ticker .run span{margin-right:48px}
  .ticker .run b{color:var(--sand);font-weight:600}
  @keyframes tick{to{transform:translateX(-100%)}}

  /* ---------- monitors ---------- */
  .deck{display:grid;gap:10px;padding:10px 10px 90px}
  .mon{position:relative;background:var(--panel);border:1px solid var(--line);min-width:0}
  .mon>header{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .mon>header .cap{color:var(--sand)}
  .mon>header .led{width:7px;height:7px;background:var(--ok)}
  .mon>header .meta{margin-left:auto;font:12px var(--m);color:var(--dim)}
  .mon .in{padding:14px}
  .ov{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto}
  .ov .planet{grid-row:span 2;min-height:560px}
  #mars{position:absolute;inset:34px 0 0 0}
  .planet .overlay{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
  .planet h1{margin:0;font:700 34px/1 var(--h);text-transform:uppercase;letter-spacing:.02em}
  .planet h1 span{color:var(--rust)}
  .planet p{margin:6px 0 0;color:var(--dim);max-width:40ch}
  .big{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .big div{background:var(--panel);padding:14px}
  .big b{display:block;font:600 34px/1 var(--m)}
  .big div:first-child b{color:var(--rust)}
  .chart{width:100%;height:150px}
  .chart .gl{stroke:var(--line)}
  .chart .ln{fill:none;stroke:var(--rust);stroke-width:2}
  .chart .ar{fill:rgba(255,106,43,.15)}
  .chart text{font:10.5px var(--m);fill:var(--dim)}
  .posts{width:100%;border-collapse:collapse;font-size:13.5px}
  .posts td{padding:7px 4px;border-bottom:1px solid var(--line)}
  .posts tr{cursor:default}
  .posts tr:hover td,.posts tr.on td{background:rgba(255,106,43,.08);color:var(--sand)}
  .posts .bar{width:100%;height:6px;background:#2a1a13}
  .posts .bar b{display:block;height:100%;background:var(--rust)}
  .posts .n{font:600 13px var(--m);text-align:right;width:30px}
  .window{text-align:center;padding:18px 14px}
  .window b{display:block;font:600 40px/1 var(--m);color:var(--haz);letter-spacing:.04em}
  .window .go{margin-top:12px}

  /* ---------- manifest ---------- */
  .man{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr)}
  .mtools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
  .mtools input{flex:1;min-width:180px;height:34px;padding:0 10px;border:1px solid var(--line);background:#0f0806;outline:none}
  .mtools input:focus{border-color:var(--rust)}
  .mt{width:100%;border-collapse:collapse;font-size:13.5px}
  .mt th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font:600 11.5px var(--h);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .mt th button{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;color:inherit;text-transform:inherit}
  .mt th button:hover,.mt th button.on{color:var(--rust)}
  .mt td{padding:9px 10px;border-bottom:1px solid var(--line)}
  .mt tbody tr{cursor:pointer}
  .mt tbody tr:hover td{background:rgba(255,106,43,.06)}
  .mt tbody tr.sel td{background:rgba(255,106,43,.14)}
  .mt td.mono{font-family:var(--m)}
  .cb{width:16px;height:16px;accent-color:var(--rust)}
  .fitbar{display:inline-block;width:60px;height:6px;background:#2a1a13;vertical-align:middle;margin-right:6px}
  .fitbar b{display:block;height:100%;background:var(--rust)}
  .bulk{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--rust);color:#000;font:600 14px var(--h);transform:translateY(100%);opacity:0;transition:all .25s}
  .bulk.on{transform:none;opacity:1}
  .bulk button{height:30px;padding:0 12px;border:1px solid #000;background:none;font:600 13px var(--h);letter-spacing:.06em}
  .bulk button:first-of-type{margin-left:auto;background:#000;color:var(--rust)}
  .detail h2{margin:0 0 2px;font:700 24px/1.15 var(--h)}
  .detail .co{color:var(--dim);margin-bottom:14px}
  .spec{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line)}
  .spec dt,.spec dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
  .spec dd{font-family:var(--m)}
  .btn{height:38px;padding:0 16px;border:1px solid var(--rust);background:var(--rust);color:#000;font:600 13px var(--h);letter-spacing:.1em;text-transform:uppercase;transition:background .15s}
  .btn:hover{background:#ff854f}
  .btn.o{background:transparent;color:var(--rust)}
  .btn.o:hover{background:rgba(255,106,43,.1)}
  .btn:disabled{opacity:.4;cursor:default}
  .rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

  /* ---------- comms array ---------- */
  .console{display:flex;gap:10px;overflow-x:auto;padding:14px}
  .ch{flex:0 0 118px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border:1px solid var(--line);background:#120a07;cursor:pointer}
  .ch:hover,.ch.on{border-color:var(--rust)}
  .meter{display:flex;flex-direction:column-reverse;gap:3px;width:34px;height:180px}
  .meter i{flex:1;background:#2a1a13}
  .meter i.on{background:var(--ok)}
  .meter i.on.hi{background:var(--haz)}
  .ch.failed .meter i{background:#2a1a13}
  .ch.failed .flat{width:100%;height:2px;background:var(--bad);animation:fl 1s steps(2) infinite}
  @keyframes fl{50%{opacity:.2}}
  .ch.waiting .meter i:nth-child(1){background:var(--haz);animation:fl 1.4s steps(2) infinite}
  .ch b{font:600 16px var(--m)}
  .ch span{font:600 11px/1.2 var(--h);letter-spacing:.08em;text-transform:uppercase;text-align:center;color:var(--dim);min-height:28px}
  .ch em{font:11px var(--m);font-style:normal;color:var(--ok)}
  .ch.failed em{color:var(--bad)}.ch.waiting em{color:var(--haz)}
  .chdetail{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
  .chdetail div{background:var(--panel);padding:14px}
  .chdetail b{display:block;font:600 20px var(--m);margin-top:4px}

  /* ---------- crew record ---------- */
  .crew{grid-template-columns:minmax(0,380px) minmax(0,1fr)}
  .patch{display:grid;place-items:center;padding:26px}
  .patch svg{width:100%;max-width:300px}
  .rec{width:100%;border-collapse:collapse}
  .rec td{padding:10px 12px;border-bottom:1px solid var(--line)}
  .rec td:first-child{width:170px}
  .quals{display:flex;flex-wrap:wrap;gap:6px}
  .quals span{padding:5px 10px;border:1px solid var(--sand);color:var(--sand);font:600 12.5px var(--h);letter-spacing:.06em;text-transform:uppercase}
  .rules{list-style:none;margin:0;padding:0;counter-reset:r}
  .rules li{counter-increment:r;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rules li::before{content:"R-0" counter(r);font:600 13px var(--m);color:var(--rust)}

  /* ---------- gate: launch control ---------- */
  .gate{min-height:100vh;display:grid;grid-template-columns:1.2fr minmax(380px,.8fr)}
  .gate .limb{position:relative;overflow:hidden;border-right:1px solid var(--line)}
  #limb{position:absolute;inset:0}
  .gate .limb .copy{position:absolute;left:40px;top:40px;right:40px}
  .gate .limb h1{margin:0;font:700 clamp(40px,5vw,72px)/.95 var(--h);text-transform:uppercase}
  .gate .limb h1 span{color:var(--rust)}
  .gate .limb p{color:var(--dim);max-width:44ch}
  .ctrl{display:flex;flex-direction:column;justify-content:center;padding:40px;background:var(--panel)}
  .ctrl h2{margin:6px 0 20px;font:700 26px var(--h);text-transform:uppercase;letter-spacing:.06em}
  .fld{margin-bottom:14px}
  .fld label{display:block;margin-bottom:6px}
  .fld input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);background:#0f0806;outline:none;font-family:var(--m)}
  .fld input:focus{border-color:var(--rust)}
  .fld input[aria-invalid="true"]{border-color:var(--bad)}
  .fld .err{margin-top:6px;color:var(--bad);font-size:13px}
  .arm{display:flex;align-items:center;gap:16px;margin:18px 0}
  .cover{position:relative;width:120px;height:64px;border:2px solid var(--haz);background:repeating-linear-gradient(-45deg,var(--haz) 0 10px,#000 10px 20px);perspective:400px}
  .cover .lid{position:absolute;inset:0;background:rgba(255,176,32,.35);border:2px solid var(--haz);transform-origin:top;transition:transform .5s cubic-bezier(.34,1.56,.64,1);display:grid;place-items:center;font:700 12px var(--h);letter-spacing:.14em;color:#000;backdrop-filter:blur(2px)}
  .cover.open .lid{transform:rotateX(-110deg)}
  .launch{width:100%;height:56px;border:0;background:var(--bad);color:#fff;font:700 18px var(--h);letter-spacing:.2em;text-transform:uppercase;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
  .launch:disabled{background:#3a241b;color:var(--dim);cursor:not-allowed;box-shadow:none}
  .lnk{border:0;background:none;padding:0;color:var(--rust);text-decoration:underline;text-underline-offset:3px}
  .stepper{display:grid;grid-template-columns:200px 1fr;gap:26px}
  .stepper ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
  .stepper li{position:relative;padding:0 0 22px 18px;color:var(--dim)}
  .stepper li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;background:var(--line)}
  .stepper li.on{color:var(--ink)}
  .stepper li.on::before{background:var(--rust)}
  .stepper li b{display:block;font:600 13px var(--h);letter-spacing:.1em;text-transform:uppercase}
  .terr{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
  .terr label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);cursor:pointer}
  .terr input{accent-color:var(--rust)}

  /* ---------- countdown ---------- */
  .count{min-height:100vh;display:grid;place-items:center;text-align:center}
  .t{font:700 180px/1 var(--h);color:var(--rust);text-shadow:0 0 40px rgba(255,106,43,.4)}
  .stages{display:inline-grid;gap:6px;margin-top:20px;text-align:left;font:13.5px var(--m)}
  .stages div{color:#5a4133}
  .stages div.done{color:var(--ok)}
  .stages div.done::before{content:"✓ "}
  .stages div:not(.done)::before{content:"· "}

  /* ---------- states ---------- */
  .sk{display:block;height:14px;margin:8px 0;background:linear-gradient(90deg,#1f130e 25%,#3a241b 50%,#1f130e 75%);background-size:200% 100%;animation:dust 1.3s linear infinite}
  @keyframes dust{to{background-position:-200% 0}}
  .notel{display:grid;place-items:center;min-height:200px;background:repeating-linear-gradient(-45deg,transparent 0 12px,rgba(255,106,43,.05) 12px 24px)}
  .quiet{display:grid;justify-items:center;text-align:center;gap:8px;padding:50px 20px}
  .quiet h3{margin:10px 0 0;font:700 22px var(--h);text-transform:uppercase;letter-spacing:.06em}
  .quiet p{margin:0;color:var(--dim);max-width:42ch}
  .black{display:flex;align-items:center;gap:14px;margin:10px 10px 0;padding:12px 14px;border:2px solid var(--haz);background:repeating-linear-gradient(-45deg,rgba(255,176,32,.14) 0 14px,transparent 14px 28px)}
  .black b{display:block;font:700 15px var(--h);letter-spacing:.12em;color:var(--haz)}
  .black .btn{margin-left:auto}
  #toasts{position:fixed;right:14px;bottom:80px;z-index:50;display:grid;gap:6px;width:320px}
  .toast{padding:10px 12px 10px 14px;background:var(--panel-2);border:1px solid var(--line);border-left:0;box-shadow:inset 3px 0 0 var(--rust);font-size:13.5px;transform:translateY(20px);opacity:0;transition:all .3s}
  .toast::before{content:attr(data-t) " · MISSION LOG";display:block;font:600 11px var(--m);color:var(--rust);margin-bottom:2px}
  .toast.in{transform:none;opacity:1}
  .toast.warn{box-shadow:inset 3px 0 0 var(--haz)}
  .kit{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kit .in{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .sw{width:50px;height:26px;border:1px solid var(--rust);background:#0f0806;position:relative}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--dim);transition:transform .2s}
  .sw[aria-checked="true"]::after{transform:translateX(24px);background:var(--rust)}
  .modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.6)}
  .modal .mon{width:min(420px,92vw)}

  @media (max-width:1100px){
    .ov{grid-template-columns:1fr 1fr}.ov .planet{grid-column:1/-1;grid-row:auto;min-height:420px}
    .man,.crew{grid-template-columns:1fr}
    .kit{grid-template-columns:1fr 1fr}
  }
  @media (max-width:760px){
    .mbar{height:auto;flex-wrap:wrap}
    .mbar .logo{height:50px}
    .tabs{order:3;width:100%;overflow-x:auto;border-top:1px solid var(--line)}
    .tabs button{height:46px;padding:0 12px;font-size:12.5px}
    .clock div:nth-child(2){display:none}
    .ov,.kit{grid-template-columns:1fr}
    .gate{grid-template-columns:1fr}.gate .limb{min-height:44vh}
    .ctrl{padding:26px 18px}
    .stepper{grid-template-columns:1fr}
    .chdetail{grid-template-columns:1fr 1fr}
    .t{font-size:120px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lab-core.js"></script>
<script>
const { $, $$, esc, fmt, cname, ago, DATA, PLACE, vec, rand, sprite, stage, toast: baseToast, go, reduce } = Lab;
const T = THREE;
const toast = (m, k) => { baseToast(m, k); const all = $$('#toasts .toast'); all[all.length - 1].dataset.t = new Date().toTimeString().slice(0, 8); };

/* ================= 3D: Mars ================= */
let world = null, focus = null;
function mars(host, opts) {
  if (world) world.dispose();
  world = stage(host, { cam: opts.cam, look: opts.look, px: 0.6, py: 0.4 });
  const { scene } = world;
  scene.add(new T.AmbientLight(0x331a10, 0.9));
  const sun = new T.DirectionalLight(0xfff0dc, 1.6); sun.position.set(-5, 2, 4); scene.add(sun);
  const stars = new T.Points(new T.BufferGeometry().setAttribute('position', new T.Float32BufferAttribute([...Array(2400)].map(() => (rand() - 0.5) * 120), 3)), new T.PointsMaterial({ color: 0xffe9d6, size: 0.12, transparent: true, opacity: 0.8 }));
  scene.add(stars);
  const planet = new T.Group(); scene.add(planet);
  const g = new T.SphereGeometry(1.8, 128, 96); const pp = g.attributes.position; const v = new T.Vector3();
  const craters = [...Array(40)].map(() => ({ c: new T.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(), r: 0.05 + rand() * 0.18 })); const cols = [];
  for (let i = 0; i < pp.count; i++) { v.fromBufferAttribute(pp, i).normalize(); let h = Math.sin(v.x * 7) * Math.cos(v.y * 5) * 0.015 + Math.sin(v.z * 13 + v.x * 4) * 0.008;
    craters.forEach((k) => { const d = v.distanceTo(k.c) / k.r; if (d < 1) h -= (1 - d * d) * 0.05 * k.r * 6; else if (d < 1.25) h += (1.25 - d) * 0.03 * k.r * 6; });
    v.multiplyScalar(1.8 + h); pp.setXYZ(i, v.x, v.y, v.z); const s = 0.75 + h * 6; const cap = Math.abs(v.y) > 1.66; cols.push(cap ? 0.95 : 0.76 * s, cap ? 0.9 : 0.29 * s, cap ? 0.85 : 0.12 * s); }
  g.setAttribute('color', new T.Float32BufferAttribute(cols, 3)); g.computeVertexNormals();
  planet.add(new T.Mesh(g, new T.MeshStandardMaterial({ vertexColors: true, roughness: 1 })));
  scene.add(new T.Mesh(new T.SphereGeometry(1.95, 64, 64), new T.ShaderMaterial({ side: T.BackSide, transparent: true, blending: T.AdditiveBlending, depthWrite: false,
    vertexShader: 'varying vec3 n; void main(){ n = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 n; void main(){ float i = pow(max(0.0,0.6-dot(n,vec3(0,0,1.0))),3.0); gl_FragColor = vec4(1.0,0.45,0.2,1.0)*i*1.2; }' })));
  const moon = new T.Mesh(new T.IcosahedronGeometry(0.16, 1), new T.MeshStandardMaterial({ color: 0x7a6a5e, flatShading: true })); moon.scale.set(1.3, 0.9, 1); scene.add(moon);
  const mx = Math.max(...DATA.byCountry.map((r) => r.n));
  const posts = DATA.byCountry.filter((r) => PLACE[r.country]).map((r) => { const [la, lo] = PLACE[r.country]; const n = vec(la, lo, 1).normalize(); const h = 0.12 + 0.45 * r.n / mx;
    const beam = new T.Mesh(new T.CylinderGeometry(0.012, 0.02, h, 6), new T.MeshBasicMaterial({ color: 0xFF6A2B })); beam.position.copy(n.clone().multiplyScalar(1.8 + h / 2)); beam.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), n); planet.add(beam);
    const tip = sprite(0xFFB27A, 0.18); tip.position.copy(n.clone().multiplyScalar(1.8 + h)); planet.add(tip);
    const ring = new T.Mesh(new T.RingGeometry(0.05, 0.065, 32), new T.MeshBasicMaterial({ color: 0xF2C99A, transparent: true, side: T.DoubleSide })); ring.position.copy(n.clone().multiplyScalar(1.81)); ring.lookAt(n.clone().multiplyScalar(4)); planet.add(ring);
    return { code: r.country, tip, ring, ph: rand() * 6 }; });
  planet.rotation.x = 0.25;
  world.tick((dt, t) => { if (!reduce) { planet.rotation.y += dt * 0.07; stars.rotation.y += dt * 0.004; }
    moon.position.set(Math.cos(t * 0.35) * 3.1, Math.sin(t * 0.35) * 0.6, Math.sin(t * 0.35) * 3.1);

  timers.push(setInterval(() => { const m = $('#met'); if (m) m.textContent = sol().met; const w = $('#win'); if (w) w.textContent = nextSweep(); }, 1000));

  const pk = e.target.closest('[data-pick]'); if (pk) { e.stopPropagation(); const id = +pk.dataset.pick; pk.checked ? picked.add(id) : picked.delete(id); $('#bulk').classList.toggle('on', picked.size > 0); $('#bn').textContent = picked.size + ' selected'; return; }
  if (e.target.id === 'all') { $$('[data-pick]').forEach((c) => { c.checked = e.target.checked; e.target.checked ? picked.add(+c.dataset.pick) : picked.delete(+c.dataset.pick); }); $('#bulk').classList.toggle('on', picked.size > 0); $('#bn').textContent = picked.size + ' selected'; return; }
  const bk = e.target.closest('[data-bulk]'); if (bk) { toast(picked.size + ' items · ' + bk.dataset.bulk); picked.clear(); return go('jobs'); }
  const so = e.target.closest('[data-sort]'); if (so) { sortKey = so.dataset.sort; return go('jobs'); }
  const r = e.target.closest('tr[data-job]'); if (r) { sel = +r.dataset.job; return go('jobs'); }
  if (e.target.closest('[data-clear]')) { q = ''; return go('jobs'); }
  const ch = e.target.closest('[data-ch]'); if (ch) { chSel = +ch.dataset.ch; return go('sources'); }
  if (e.target.closest('[data-back]')) { step--; return go('signup'); }
  if (e.target.closest('[data-modal]')) return openModal();
  if (e.target.closest('[data-x]')) { toast('Salary floor saved'); return $('.modal')?.remove(); }
  if (e.target.classList.contains('modal')) return e.target.remove();
  const sw = e.target.closest('.sw'); if (sw) sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
});
document.addEventListener('pointerover', (e) => { const tr = e.target.closest('.posts tr'); focus = tr ? tr.dataset.code : null; $$('.posts tr').forEach((x) => x.classList.toggle('on', x === tr)); });
document.addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value; clearTimeout(window._q); window._q = setTimeout(() => { go('jobs'); const i = $('#q'); i.focus(); i.setSelectionRange(q.length, q.length); }, 300); } });
document.addEventListener('submit', (e) => { e.preventDefault();
  if (e.target.id === 'login') { $('#launch').textContent = 'Launching…'; setTimeout(() => go('loading'), 700); }
  if (e.target.id === 'signup') { if (step < 3) { step++; go('signup'); } else { toast('Application accepted. Welcome aboard.'); go('loading'); } } });
addEventListener('keydown', (e) => { if (e.target.matches('input,select')) return; const k = { 1: 'overview', 2: 'jobs', 3: 'sources', 4: 'profile' }[e.key];
  if (k && !['login', 'signup'].includes(Lab.current.screen)) go(k); if (e.key === 'Escape') $('.modal')?.remove(); });
Lab.start({ show });
</script>
