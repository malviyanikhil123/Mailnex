server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell, runtime config or service worker, so a deploy
    # is picked up on the next refresh instead of pointing at deleted assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(config\.js|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
